plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.peshke.launchio'
    compileSdk 34

    defaultConfig {
        // -PlauncherApplicationId=io.github.peshke.launchio.dev installs a test build next to the real one.
        // Test builds don't offer themselves as a home screen, so installing one never changes what Home opens.
        def appId = providers.gradleProperty('launcherApplicationId').getOrElse('io.github.peshke.launchio')
        def testBuild = appId != 'io.github.peshke.launchio'
        applicationId appId
        manifestPlaceholders = [
            homeCategory: testBuild ? 'io.github.peshke.launchio.category.TEST_HOME' : 'android.intent.category.HOME',
            // COMMON_HOME: CVTE firmware lists only launchers that declare it (#1201 upstream).
            commonHomeCategory: testBuild ? 'io.github.peshke.launchio.category.TEST_COMMON_HOME' : 'android.intent.category.COMMON_HOME',
            appLabel: testBuild ? 'Launchio (test)' : '@string/app_name',
        ]
        minSdk 26
        targetSdk 34
        // Launchio's numbering: versionCode = major * 10000 + minor * 100 + patch.
        versionCode 202
        versionName '0.2.2'
    }

    signingConfigs {
        // Launchio's release key, from ~/.gradle/gradle.properties (never the repo):
        //   launchioKeystore=/path/to/launchio.keystore  launchioKeystorePassword=…
        //   launchioKeyAlias=…  launchioKeyPassword=…
        // Without them, release builds fall back to the debug key.
        if (providers.gradleProperty('launchioKeystore').isPresent()) {
            launchio {
                storeFile file(providers.gradleProperty('launchioKeystore').get())
                storePassword providers.gradleProperty('launchioKeystorePassword').get()
                keyAlias providers.gradleProperty('launchioKeyAlias').get()
                keyPassword providers.gradleProperty('launchioKeyPassword').get()
            }
        }
    }
    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Launchio's key when configured (see signingConfigs), so a release installs over the last one.
            signingConfig signingConfigs.findByName('launchio') ?: signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
    // The real org.json for the JVM tests: android.jar only has stubs that throw.
    testImplementation 'org.json:json:20231013'
}
